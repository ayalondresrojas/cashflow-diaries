<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cashflow Diaries</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@300;400;500;600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF9F6; --surface:#FFFFFF; --surface-2:#F2F0EB; --ink:#242424; --ink-2:#5F5A52; --ink-3:#8C867C; --head:#7A7164;
  --line:#E4E0D8; --accent:#242424; --accent-ink:#FAF9F6; --accent-soft:#EDEAE4; --danger:#A54B40; --income:#5E7A5B;
  --hatch:#DDD8CF;
  --font-head:Aileron,"Inter Tight","Helvetica Neue",Helvetica,Arial,sans-serif;
  --font-body:"Articulat CF",Articulat,Manrope,"Helvetica Neue",Helvetica,Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#242424; --surface:#2B2B2A; --surface-2:#323130; --ink:#FAF9F6; --ink-2:#CFC9BF; --ink-3:#958E83; --head:#B8B0A3;
    --line:#3C3A37; --accent:#FAF9F6; --accent-ink:#242424; --accent-soft:#3A3834; --danger:#E0968B; --income:#A9C2A5;
    --hatch:#3E3C38; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#242424; --surface:#2B2B2A; --surface-2:#323130; --ink:#FAF9F6; --ink-2:#CFC9BF; --ink-3:#958E83; --head:#B8B0A3;
    --line:#3C3A37; --accent:#FAF9F6; --accent-ink:#242424; --accent-soft:#3A3834; --danger:#E0968B; --income:#A9C2A5;
    --hatch:#3E3C38; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;padding-bottom:84px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
.wrap{max-width:560px;margin:0 auto;padding:0 18px}
.num{font-family:var(--font-head);font-variant-numeric:tabular-nums;letter-spacing:-0.01em}

/* top bar */
.brand{padding:16px 0 0}
.brand b{display:block;font-family:var(--font-head);font-weight:500;font-size:1.15rem;letter-spacing:.02em;color:var(--ink);line-height:1.2}
.brand span{display:block;font-size:.8rem;color:var(--head);margin-top:2px}
.top{display:flex;align-items:center;justify-content:space-between;padding:18px 0 6px;gap:8px}
.month-nav{display:flex;align-items:center;gap:4px}
.month-nav h1{font-family:var(--font-head);font-weight:500;color:var(--head);letter-spacing:.01em;font-size:1.3rem;margin:0 6px;min-width:9.5ch;text-align:center}
.icon-btn{width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink-2)}
.icon-btn svg{width:20px;height:20px}
.status{font-size:.85rem;color:var(--ink-3);min-height:1.2em;padding:0 2px}
.status.warn{color:var(--danger);font-weight:600}
.greet{font-family:var(--font-head);font-size:1.3rem;font-weight:400;color:var(--ink);margin:10px 0 4px;letter-spacing:.005em}
.nudge{display:flex;gap:10px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);border-left:3px solid var(--head);border-radius:10px;padding:11px 12px;margin:10px 0;font-size:.9rem;color:var(--ink-2)}
.nudge svg{width:18px;height:18px;flex:none;margin-top:1px;color:var(--head)}
.privacy{display:flex;gap:10px;align-items:flex-start;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:11px 12px;margin-top:16px;font-size:.86rem;color:var(--ink-2)}
.privacy svg{width:18px;height:18px;flex:none;margin-top:1px;color:var(--head)}

/* hero */
.hero{padding:14px 0 6px}
.hero .label{color:var(--head);letter-spacing:.01em;font-size:.95rem}
.hero .big{font-size:clamp(2.6rem,11vw,3.6rem);font-weight:300;letter-spacing:-0.025em;line-height:1.02;margin:2px 0 4px}
.hero .big.neg{color:var(--danger)}
.hero .sub{color:var(--ink-2);font-size:.95rem}
.ribbon{display:flex;height:14px;border-radius:3px;overflow:hidden;margin:16px 0 8px;background:repeating-linear-gradient(135deg,var(--hatch) 0 6px,transparent 6px 11px);border:1px solid var(--line)}
.ribbon span{display:block;height:100%;transition:flex-basis .5s ease}
.ribbon-legend{display:flex;justify-content:space-between;font-size:.82rem;color:var(--ink-3)}

/* sections */
section.block{background:var(--surface);border-radius:12px;padding:16px;margin:16px 0;border:1px solid var(--line)}
.block h2{font-family:var(--font-head);font-size:1.05rem;font-weight:500;color:var(--head);letter-spacing:.01em;margin:0 0 10px}
.row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.row:first-of-type{border-top:0}
.dot{width:12px;height:12px;border-radius:4px;flex:none}
.row .name{flex:1;min-width:0}
.row .name small{display:block;color:var(--ink-3);font-size:.82rem}
.row .amt{font-weight:700;text-align:right;white-space:nowrap}
.row .amt small{display:block;font-weight:500;color:var(--ink-3);font-size:.78rem}
.bar{height:5px;background:var(--surface-2);border-radius:3px;margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px}
.empty{text-align:center;padding:26px 8px;color:var(--ink-2)}
.empty p{margin:0 0 14px}
.period{margin:10px 0 2px}
.months{display:grid;grid-template-columns:repeat(12,1fr);gap:4px;align-items:end;height:120px;margin-top:6px}
.months div{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;font-size:.72rem;color:var(--ink-3)}
.months i{display:block;width:100%;border-radius:4px 4px 2px 2px;background:var(--accent);min-height:2px}
.months i.over{background:var(--danger)}
.months div.cur span{color:var(--ink);font-weight:700}
.pct{font-family:var(--font-head);font-size:1.2rem;font-weight:500}

/* buttons */
.btn{border:0;border-radius:10px;letter-spacing:.01em;padding:13px 18px;font-weight:700;background:var(--accent);color:var(--accent-ink);font-size:1rem}
.btn.full{width:100%}
.btn.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line)}
.btn.small{padding:8px 12px;font-size:.88rem;border-radius:11px}
.btn.danger{background:transparent;color:var(--danger);border:1px solid var(--line)}
.btn:disabled{opacity:.5;cursor:default}

/* add form */
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--surface-2);border:1px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg.three{grid-template-columns:1fr 1fr 1fr}
.seg button{border:0;background:transparent;padding:10px 6px;border-radius:10px;font-weight:600;color:var(--ink-2);font-size:.92rem}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(15,21,34,.12)}
.amount-field{display:flex;align-items:baseline;gap:8px;border-bottom:2px solid var(--line);padding:14px 2px 8px;margin:12px 0 4px}
.amount-field:focus-within{border-color:var(--accent)}
.amount-field span{font-weight:600;color:var(--ink-3)}
.amount-field input{border:0;background:transparent;font-family:var(--font-head);font-size:2.6rem;font-weight:300;width:100%;outline:none;padding:0}
.field{display:block;margin:14px 0}
.field > span{display:block;font-size:.88rem;font-weight:600;color:var(--ink-2);margin-bottom:6px}
.field input,.field select{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:1rem}
.field small{display:block;color:var(--ink-3);font-size:.82rem;margin-top:5px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.cat{display:flex;align-items:center;gap:9px;text-align:left;padding:10px 11px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);font-size:.92rem;font-weight:600;line-height:1.2}
.cat .dot{width:10px;height:10px}
.cat[aria-pressed="true"]{border-color:var(--ink);background:var(--surface);box-shadow:inset 0 0 0 1px var(--ink)}
.cat em{display:block;font-style:normal;font-weight:500;color:var(--ink-3);font-size:.76rem;margin-top:2px}
.scan{display:flex;gap:12px;align-items:center;padding:14px;border-radius:16px;border:1.5px dashed var(--line);background:var(--surface-2);width:100%;text-align:left;margin-bottom:6px}
.scan svg{width:28px;height:28px;flex:none;color:var(--accent)}
.scan b{display:block}
.scan small{color:var(--ink-3)}
.suggest{font-size:.85rem;color:var(--accent);min-height:1.2em;margin-top:6px}

/* loans */
.loan{padding:14px 0;border-top:1px solid var(--line)}
.loan:first-of-type{border-top:0;padding-top:4px}
.loan-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.loan-head b{font-size:1.05rem}
.tag{display:inline-block;font-size:.75rem;font-weight:600;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);padding:2px 8px;border-radius:20px;margin-top:4px}
.tag.done{color:var(--income);border-color:currentColor;background:transparent}
.ticks{display:flex;flex-wrap:wrap;gap:3px;margin:12px 0 8px}
.ticks i{width:9px;height:9px;border-radius:2px;background:var(--surface-2);border:1px solid var(--line)}
.ticks i.on{background:var(--loan-c,#C2453D);border-color:transparent}
.ticks.dense i{width:6px;height:6px;gap:2px}
.loan-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 12px}
.loan-stats div{background:var(--surface-2);border-radius:12px;padding:9px 10px}
.loan-stats b{display:block;font-size:1.15rem}
.loan-stats span{font-size:.76rem;color:var(--ink-3)}
.loan-actions{display:flex;gap:8px;flex-wrap:wrap}

/* history */
.day{font-size:.82rem;font-weight:700;color:var(--ink-3);margin:16px 2px 4px}
.tx{display:flex;align-items:center;gap:12px;padding:11px 12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;margin-bottom:6px;width:100%;text-align:left}
.tx .name{flex:1;min-width:0}
.tx .name b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .name small{color:var(--ink-3);font-size:.82rem}
.tx .amt{font-weight:700;white-space:nowrap}
.tx .amt.in{color:var(--income)}
.toolbar{display:flex;gap:8px;align-items:center;margin:8px 0 4px}
.toolbar select{flex:1;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface)}
.totals{display:flex;gap:8px;margin:10px 0}
.totals div{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.totals span{display:block;font-size:.8rem;color:var(--ink-3)}
.totals b{font-size:1.15rem}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:20}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.thumb{width:34px;height:34px;border-radius:8px;object-fit:cover;flex:none;border:1px solid var(--line);background:var(--surface-2);cursor:zoom-in}
.rc-box{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
#rcThumb{width:72px;height:72px;object-fit:cover;border-radius:12px;border:1px solid var(--line);cursor:zoom-in}
.stmt h2{margin-bottom:2px}
.stmt .count{font-size:.85rem;color:var(--ink-3);margin-bottom:8px}
.srow{display:flex;align-items:center;gap:10px;width:100%;padding:10px 0;border:0;border-top:1px dashed var(--line);background:transparent;text-align:left}
.slist .srow:first-child{border-top:0}
.sdate{width:3.3em;flex:none;font-size:.8rem;color:var(--ink-3)}
.sname{flex:1;min-width:0}
.sname b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sname small{color:var(--ink-3);font-size:.8rem}
.samt{font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.sgroup{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:16px 0 0;padding-bottom:4px;font-weight:700;border-bottom:1px solid var(--line)}
.sgroup:first-child{margin-top:4px}
.sgroup span{display:flex;align-items:center;gap:8px}
.stmt-foot{border-top:1px solid var(--head);margin-top:12px;padding-top:10px}
.stmt-foot .line{display:flex;justify-content:space-between;padding:4px 0;color:var(--ink-2)}
.stmt-foot .line b{color:var(--ink);font-variant-numeric:tabular-nums}
.stmt-foot .left{margin-top:6px;padding-top:10px;border-top:1px solid var(--line);align-items:baseline}
.stmt-foot .left span{color:var(--ink);font-weight:700;font-size:1.05rem}
.stmt-foot .left b{font-family:var(--font-head);font-size:1.8rem;font-weight:400}
.stmt-foot .left b.neg{color:var(--danger)}
nav.tabs button{border:0;background:transparent;padding:9px 4px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.76rem;font-weight:600;color:var(--ink-3)}
nav.tabs button svg{width:23px;height:23px}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs .add-tab span.plus{width:44px;height:30px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center}
nav.tabs .add-tab span.plus svg{width:20px;height:20px}

/* sheet */
.sheet-back{position:fixed;inset:0;background:rgba(10,14,24,.45);z-index:40;display:none;align-items:flex-end;justify-content:center}
.sheet-back.open{display:flex}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .22s ease}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.sheet h3{font-family:var(--font-head);font-weight:500;color:var(--head);margin:0 0 4px;font-size:1.3rem}
.sheet .x{float:right}
.sheet .actions{display:flex;gap:8px;margin-top:18px}
.sheet .actions .btn{flex:1}

.toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:14px;font-weight:600;font-size:.92rem;opacity:0;pointer-events:none;transition:all .2s;z-index:60;max-width:90vw;text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.thinking{display:flex;gap:10px;align-items:center;color:var(--ink-2);padding:12px 2px}
.spin{width:18px;height:18px;border-radius:50%;border:2.5px solid var(--line);border-top-color:var(--accent);animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand"><b>Cashflow Diaries</b><span>Your budget &amp; financial expenses tracker</span></div>
  <header class="top">
    <div class="month-nav">
      <button class="icon-btn" id="prevM" aria-label="Previous month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button>
      <h1 id="monthTitle">—</h1>
      <button class="icon-btn" id="nextM" aria-label="Next month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div style="display:flex;gap:8px"><button class="icon-btn" id="themeBtn" aria-label="Switch theme"></button>
    <button class="icon-btn" id="openSettings" aria-label="Salary and settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg></button></div>
  </header>
  <div class="status" id="status" role="status"></div>

  <!-- OVERVIEW -->
  <main id="view-home" class="view"></main>

  <!-- ADD -->
  <main id="view-add" class="view" hidden>
    <div style="padding-top:8px">
      <button class="scan" id="scanBtn" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 8V5a1 1 0 011-1h3M16 4h3a1 1 0 011 1v3M20 16v3a1 1 0 01-1 1h-3M8 20H5a1 1 0 01-1-1v-3"/><path d="M8 9h8M8 12h8M8 15h5"/></svg>
        <span><b>Scan a receipt or invoice</b><small>Take a photo and I’ll fill in the amount, date and category.</small></span>
      </button>
      <input type="file" id="scanFile" accept="image/*" hidden>
      <div class="thinking" id="scanThinking" hidden><div class="spin"></div><span>Reading your receipt…</span></div>

      <div class="seg" id="kindSeg" style="margin-top:12px">
        <button data-kind="expense" aria-pressed="true">Money out</button>
        <button data-kind="income" aria-pressed="false">Money in</button>
      </div>

      <label class="amount-field"><span id="curLabel">AED</span><input id="fAmount" inputmode="decimal" placeholder="0" autocomplete="off" aria-label="Amount"></label>

      <label class="field"><span>What was it?</span><input id="fNote" placeholder="e.g. Starbucks, DEWA bill, rent for May" autocomplete="off">
        <div class="suggest" id="suggest"></div></label>

      <div class="field" id="catField"><span>Category</span><div class="cats" id="catGrid"></div></div>

      <label class="field"><span>Date paid</span><input type="date" id="fDate"></label>

      <div class="field" id="rcField" hidden><span>Invoice or receipt photo</span>
        <div class="rc-box">
          <img id="rcThumb" alt="Receipt photo" hidden>
          <button type="button" class="btn small ghost" id="rcAdd">Add photo</button>
          <button type="button" class="btn small danger" id="rcRemove" hidden>Remove</button>
        </div>
        <input type="file" id="rcFile" accept="image/*" hidden>
      </div>

      <button class="btn full" id="saveTx">Save</button>
      <div style="height:10px"></div>
      <button class="btn danger full" id="delTx" hidden>Delete this entry</button>
      <button class="btn ghost full" id="cancelEdit" hidden style="margin-top:8px">Cancel editing</button>
    </div>
  </main>

  <!-- LOANS -->
  <main id="view-loans" class="view" hidden></main>

  <!-- HISTORY -->
  <main id="view-history" class="view" hidden></main>

  <!-- MONTHLY EXPENSES -->
  <main id="view-expenses" class="view" hidden></main>
</div>

<nav class="tabs" aria-label="Sections"><div class="in">
  <button data-tab="home" aria-current="page"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 19V10M10 19V5M16 19v-6M22 19H2"/></svg>Overview</button>
  <button data-tab="expenses"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6M9 16h3"/></svg>Expenses</button>
  <button data-tab="add" class="add-tab"><span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></span>Add</button>
  <button data-tab="loans"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg>Loans</button>
  <button data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>History</button>
</div></nav>

<div class="sheet-back" id="sheetBack"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- categories ---------- */
const CATS=[
 {id:'rent',name:'Rent',color:'#B8B0A3'},
 {id:'utilities',name:'Utilities',hint:'DEWA, internet, phone',color:'#7E9AA6'},
 {id:'family',name:'Family back home',hint:'Remittance',color:'#C2928A'},
 {id:'savings',name:'Savings',hint:'Money set aside',color:'#8FA58A'},
 {id:'sanity',name:'Sanity fund',hint:'Eating out, coffee, fun',color:'#D2A96C'},
 {id:'groceries',name:'Groceries',color:'#A6A26C'},
 {id:'transport',name:'Transportation',hint:'Metro, taxi, fuel, Salik',color:'#8E87A9'},
 {id:'subscriptions',name:'Subscriptions',hint:'Netflix, apps, gym',color:'#6F8FA2'},
 {id:'insurance',name:'Insurance',color:'#7FA39C'},
 {id:'loans',name:'Loans & installments',hint:'Credit card, bank loan',color:'#B5675C'},
 {id:'health',name:'Health & self-care',hint:'Pharmacy, clinic, salon',color:'#B08CA2'},
 {id:'pet',name:'Pet care',hint:'Food, vet, grooming',color:'#9C7E62'},
 {id:'yearly',name:'Yearly fees',hint:'Car maintenance, registration, fines',color:'#8A8784'},
 {id:'travel',name:'Travel fund',hint:'Flights, hotels, trips',color:'#C8B07C'},
 {id:'misc',name:'Miscellaneous',color:'#6E6B67'},
];
const CAT=Object.fromEntries(CATS.map(c=>[c.id,c]));
const KEYWORDS={
 rent:['rent','landlord','ejari','cheque rent'],
 utilities:['dewa','du','etisalat','e&','internet','electricity','water bill','chiller','empower','wifi','phone bill','postpaid'],
 family:['remit','remittance','western union','lulu exchange','al ansari','al fardan','wise','padala','gcash','family','send home','mama','papa'],
 savings:['savings','save','deposit','emergency fund','investment'],
 sanity:['restaurant','cafe','café','coffee','starbucks','costa','tim hortons','talabat','deliveroo','careem food','noon food','cinema','vox','reel','brunch','fine dining','bar','dinner','lunch','breakfast','eat out','mcdonald','kfc','shake shack','jollibee','pizza','dessert','movie','concert','shopping','zara','h&m'],
 groceries:['carrefour','lulu hypermarket','lulu','spinneys','waitrose','union coop','grocery','groceries','choithrams','kibsons','supermarket','west zone','viva'],
 transport:['careem','uber','taxi','rta','nol','metro','salik','fuel','petrol','enoc','adnoc','emarat','parking','bus','tram','car wash'],
 subscriptions:['netflix','spotify','apple','icloud','youtube','adobe','canva','capcut','chatgpt','claude','disney','osn','shahid','gym','subscription','amazon prime','anghami','lightroom'],
 insurance:['insurance','axa','takaful','premium','policy'],
 loans:['installment','instalment','loan','credit card','tabby','tamara','emi','card payment','cashew','postpay'],
 health:['pharmacy','clinic','hospital','doctor','aster','life pharmacy','boots','salon','spa','dental','dentist','medicine','nails','haircut','massage'],
 pet:['vet','pet','dog','grooming','petzone','pet food','dog food','sheldon'],
 travel:['flight','flights','air ticket','plane ticket','airline','emirates airline','flydubai','air arabia','etihad','cebu pacific','philippine airlines','qatar airways','booking.com','agoda','airbnb','expedia','trip.com','hotel','trip','travel','vacation','holiday','luggage','travel insurance','travel fund','airport'],
 yearly:['car service','car maintenance','maintenance','service center','garage','mechanic','oil change','tyre','tyres','tire','tires','registration','car registration','renewal','mulkiya','tasjeel','shamil','fine','fines','traffic fine','rta fine','police fine','parking fine','salik fine','penalty'],
};
const KW_LIST=[];
for(const [cat,list] of Object.entries(KEYWORDS)) for(const k of list){
  const esc=k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  KW_LIST.push({k,cat,re:new RegExp('(^|[^a-z0-9])'+esc+'($|[^a-z0-9])','i')});
}
KW_LIST.sort((a,b)=>b.k.length-a.k.length);
function guessCat(text){
  if(!text) return null;
  const t=' '+text.toLowerCase()+' ';
  for(const w of KW_LIST) if(w.re.test(t)) return w.cat;
  return null;
}

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,'0');
const todayISO=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`};
const nowYM=()=>todayISO().slice(0,7);
const addMonths=(ym,n)=>{let [y,m]=ym.split('-').map(Number);m+=n;y+=Math.floor((m-1)/12);m=((m-1)%12+12)%12+1;return `${y}-${pad(m)}`};
const monthsBetween=(a,b)=>{const [y1,m1]=a.split('-').map(Number),[y2,m2]=b.split('-').map(Number);return (y2-y1)*12+(m2-m1)};
const MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
const ymLabel=(ym,short)=>{const [y,m]=ym.split('-').map(Number);return (short?MONTHS[m-1].slice(0,3):MONTHS[m-1])+' '+y};
const dayLabel=iso=>{const d=new Date(iso+'T00:00:00');return d.toLocaleDateString('en-GB',{weekday:'short',day:'numeric',month:'short'})};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function fmt(n,noCur){
  const v=Math.round((Number(n)||0)*100)/100;
  const s=Math.abs(v).toLocaleString('en-US',{minimumFractionDigits:v%1?2:0,maximumFractionDigits:2});
  return (v<0?'−':'')+(noCur?'':state.settings.currency+' ')+s;
}
function ordinal(n){const s=['th','st','nd','rd'],v=n%100;return n+(s[(v-20)%10]||s[v]||s[0])}
function twoTap(btn,label,fn){
  if(btn.dataset.armed==='1'){fn();return}
  const old=btn.textContent;btn.dataset.armed='1';btn.textContent=label;
  setTimeout(()=>{if(btn.isConnected){btn.dataset.armed='';btn.textContent=old}},3500);
}
function saveFile(name,text,type){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);
}
let toastT;
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2600)}

/* ---------- state ---------- */
const state={
  settings:{currency:'AED',salaryHistory:[],loans:[]},
  tx:[], month:nowYM(), period:'month', group:'date', receipt:null, tab:'home', editId:null, kind:'expense', cat:null, catTouched:false, filter:'all'
};
function salaryFor(ym){
  const h=[...(state.settings.salaryHistory||[])].sort((a,b)=>a.from<b.from?-1:1);
  let amt=0; for(const e of h) if(e.from<=ym) amt=e.amount;
  if(!amt && h.length && ym<h[0].from) amt=0;
  return amt;
}

/* ---------- storage: claude db when available, else this browser ---------- */
const LKEY='salary-map-v1';
let store={mode:'local',settingsRef:null,txCol:null,writing:Promise.resolve(),readOnly:false};
function normSettings(d){
  return {currency:d?.currency||'AED',salaryHistory:Array.isArray(d?.salaryHistory)?d.salaryHistory:[],loans:Array.isArray(d?.loans)?d.loans:[],profile:(d&&d.profile&&typeof d.profile==='object')?d.profile:null};
}
function loadLocal(){
  try{const raw=localStorage.getItem(LKEY);if(raw){const d=JSON.parse(raw);state.settings=normSettings(d.settings);state.tx=Array.isArray(d.tx)?d.tx:[]}}catch(e){}
}
function saveLocal(){
  try{localStorage.setItem(LKEY,JSON.stringify({settings:state.settings,tx:state.tx}))}catch(e){}
}
function showReadOnly(){
  const st=$('#status');st.classList.add('warn');
  st.textContent='You can open this app, but your access can’t save entries. Nothing you type here is stored. Ask the owner for “Contributor” access.';
}
function onWriteErr(e){
  if(e&&e.code==='invalid_argument'){store.readOnly=true;showReadOnly();toast('This entry wasn’t saved.')}
  else if(e&&e.code==='quota_exceeded'){toast('Storage is full. Delete some old entries to keep saving.')}
  else toast('Couldn’t save that change. Check your connection and try again.');
}
function persistSettings(){
  if(store.readOnly){showReadOnly();return}
  if(store.mode==='db'){
    const body=JSON.parse(JSON.stringify(state.settings));
    store.writing=store.writing.then(()=>store.settingsRef.set(body)).catch(onWriteErr);
  } else saveLocal();
}
function persistTx(tx){
  if(store.readOnly){showReadOnly();return}
  if(store.mode==='db'){const body=JSON.parse(JSON.stringify(tx));delete body.id;store.txCol.doc(tx.id).set(body).catch(onWriteErr)}
  else saveLocal();
}
function removeTx(id){
  if(store.readOnly){showReadOnly();return}
  if(store.mode==='db') store.txCol.doc(id).delete().catch(onWriteErr);
  else saveLocal();
}

function showLocalNote(){
  if(store.mode==='local'){$('#status').textContent='Entries are saved only in this browser on this device.';maybeOnboard()}
}
async function connect(){
  if(!window.claude||typeof window.claude.use!=='function'){showLocalNote();return}
  try{
    const [db,user]=await Promise.all([claude.use('db'),claude.use('user')]);
    if(db&&user){
      const id=await user.id();
      if(id){
        store.mode='db';
        store.settingsRef=db.doc('data/users/'+id+'/settings');
        store.txCol=store.settingsRef.collection('tx');
        let gotS=false,gotT=false;
        const st=$('#status');st.textContent='Loading your entries…';
        const timer=setTimeout(()=>{st.textContent='Can’t reach your saved data yet. What you see may be out of date.'},10000);
        const done=()=>{if(gotS&&gotT){clearTimeout(timer);st.textContent=''}};
        store.settingsRef.onSnapshot(s=>{
          state.settings=normSettings(s.exists?JSON.parse(JSON.stringify(s.data())):null);
          if(!s.metadata.fromCache){gotS=true;done();maybeOnboard()}
          renderAll();
        },e=>{clearTimeout(timer);st.textContent='Your saved data isn’t available right now.'});
        store.txCol.onSnapshot(q=>{
          state.tx=q.docs.map(d=>Object.assign({id:d.id},JSON.parse(JSON.stringify(d.data()))));
          if(!q.metadata.fromCache){gotT=true;done()}
          renderAll();
        },e=>{clearTimeout(timer);st.textContent='Your saved data isn’t available right now.'});
      }
    }
  }catch(e){}
  showLocalNote();
  setupScan();
  setupDownloads();
  setupAssets();
}

/* ---------- receipt scanning ---------- */
let sample=null;
async function setupScan(){
  try{
    sample=await claude.use('sample');
    if(!sample) return;
    const lim=await sample.limits().catch(()=>null);
    if(!lim||!lim.images) return;
    $('#scanFile').accept=(lim.images.mediaTypes||['image/*']).join(',');
    store.imgMax=lim.images.maxInputBytes||0;
    $('#scanBtn').hidden=false;
  }catch(e){}
}
$('#scanBtn').onclick=()=>$('#scanFile').click();
$('#scanFile').onchange=async e=>{
  const file=e.target.files[0];e.target.value='';
  if(!file||!sample) return;
  if(store.imgMax&&file.size>store.imgMax){toast('That photo is too large. Try a smaller one.');return}
  setReceipt(file);
  $('#scanThinking').hidden=false;$('#scanBtn').disabled=true;
  const catList=CATS.map(c=>`${c.id} = ${c.name}${c.hint?' ('+c.hint+')':''}`).join('\n');
  const prompt=`You are reading a photo of a receipt, invoice or bank/transfer confirmation for a personal expense tracker. The person lives in Dubai, UAE; default currency is ${state.settings.currency}.
Reply with only one JSON object, no other text:
{"amount": number (the final total paid, no currency symbol), "currency": "3-letter code", "date": "YYYY-MM-DD" or null, "merchant": "short name of shop/company", "category": one id from the list, "note": "very short description, max 6 words"}
Category ids:
${catList}
Guidance: restaurants, cafes, food delivery, entertainment and treats = sanity. Supermarkets = groceries. Money transfers to family abroad = family. DEWA, du, Etisalat = utilities. Car maintenance or servicing, tyres, car registration renewals and traffic or parking fines = yearly. Credit card or loan installment payments = loans. If unsure, use misc.
Example: {"amount":42.5,"currency":"AED","date":"2026-11-02","merchant":"Starbucks","category":"sanity","note":"Coffee at Starbucks"}`;
  try{
    const r=await sample.json(prompt,{images:[file]});
    if(!r||typeof r!=='object') throw {code:'invalid_json'};
    setKind('expense');
    if(Number(r.amount)>0) $('#fAmount').value=String(r.amount);
    const note=r.note||r.merchant||'';
    if(note) $('#fNote').value=note;
    if(r.date&&/^\d{4}-\d{2}-\d{2}$/.test(r.date)) $('#fDate').value=r.date;
    if(r.category&&CAT[r.category]){state.cat=r.category;state.catTouched=true;renderCats()}
    const curNote=(r.currency&&r.currency.toUpperCase()!==state.settings.currency)?` The receipt is in ${r.currency}, so check the amount.`:'';
    $('#suggest').textContent=`Filled in from your receipt. Check it, then tap Save.${curNote}`;
  }catch(err){
    const c=err&&err.code;
    if(c==='not_granted'){$('#scanBtn').hidden=true;toast('Receipt scanning is off. You can still type entries in.')}
    else if(c==='cancelled'){}
    else if(c==='rate_limited') toast('Too many scans at once. Wait a minute and try again.');
    else if(c==='image_rejected') toast('That image couldn’t be read. Try a clearer photo.');
    else toast('Couldn’t read that receipt. Enter the amount by hand.');
  }finally{$('#scanThinking').hidden=true;$('#scanBtn').disabled=false}
};

/* ---------- CSV download ---------- */
let downloads=null;
async function setupDownloads(){try{downloads=await claude.use('downloads')}catch(e){} renderHistory()}
async function exportCSV(){
  const rows=[['Date','Type','Category','Description','Amount','Currency']];
  const list=monthTx(state.month).sort((a,b)=>a.date<b.date?-1:1);
  for(const t of list) rows.push([t.date,t.kind==='income'?'Money in':'Money out',t.kind==='income'?(ICAT[t.cat]?.name||'Other income'):(CAT[t.cat]?.name||'Miscellaneous'),t.note||'',t.amount,state.settings.currency]);
  const csv=rows.map(r=>r.map(v=>{const s=String(v);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s}).join(',')).join('\n');
  if(!downloads){saveFile(`expenses-${state.month}.csv`,csv,'text/csv');return}
  try{await downloads.save({filename:`expenses-${state.month}.csv`,data:csv})}
  catch(e){if(e&&e.code!=='cancelled'&&e.code!=='declined') toast('The download didn’t go through.')}
}

/* ---------- derived ---------- */
function monthTx(ym){return state.tx.filter(t=>(t.date||'').slice(0,7)===ym)}
function summary(ym){
  const list=monthTx(ym);
  const salary=salaryFor(ym);
  const extra=list.filter(t=>t.kind==='income').reduce((s,t)=>s+(+t.amount||0),0);
  const byCat={};let spent=0;
  for(const t of list) if(t.kind!=='income'){const c=CAT[t.cat]?t.cat:'misc';byCat[c]=(byCat[c]||0)+(+t.amount||0);spent+=(+t.amount||0)}
  return {salary,extra,income:salary+extra,spent,left:salary+extra-spent,byCat,count:list.length};
}
function loanInfo(l){
  const total=Math.max(1,+l.totalMonths||1);
  const paid=Math.min(total,(+l.paidBefore||0)+(l.paidLog||[]).length);
  const left=total-paid;
  const lastMonth=addMonths(l.start,total-1);
  return {total,paid,left,lastMonth,remaining:left*(+l.monthly||0),paidThisMonth:(l.paidLog||[]).includes(nowYM()),done:left<=0};
}

/* ---------- render: overview ---------- */
/* ---------- profile & personal touches ---------- */
const firstName=()=>String(state.settings.profile?.name||'').trim().split(/\s+/)[0]||'';
const addr=t=>firstName()?`${firstName()}, ${t}`:t.charAt(0).toUpperCase()+t.slice(1);
function greetHTML(){
  const n=firstName();if(!n) return '';
  const h=new Date().getHours();
  return `<div class="greet">${h<12?'Good morning':h<18?'Good afternoon':'Good evening'}, ${esc(n)}.</div>`;
}
const BELL='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.9 1.9 0 003.4 0"/></svg>';
function nudgesHTML(s){
  if(state.month!==nowYM()) return '';
  const out=[];const today=new Date().getDate();
  for(const l of state.settings.loans){
    const i=loanInfo(l);if(i.done||i.paidThisMonth||l.start>nowYM()||!l.dueDay) continue;
    const d=+l.dueDay-today;const nm=esc(l.name);
    if(d<0) out.push(addr(`your ${nm} payment was due on the ${ordinal(+l.dueDay)}. Tap Paid below once it’s settled.`));
    else if(d===0) out.push(addr(`your ${nm} payment of ${fmt(l.monthly)} is due today.`));
    else if(d<=3) out.push(addr(`your ${nm} payment of ${fmt(l.monthly)} is due ${d===1?'tomorrow':'in '+d+' days'}.`));
  }
  if(s.income&&s.left<0) out.push(addr(`you’ve spent ${fmt(-s.left)} more than came in this month.`));
  else if(s.income&&s.spent/s.income>=0.9) out.push(addr(`heads up: you’ve used ${Math.round(s.spent/s.income*100)}% of this month’s income.`));
  return out.slice(0,3).map(m=>`<div class="nudge" role="status">${BELL}<span>${m}</span></div>`).join('');
}
let onboardShown=false;
function maybeOnboard(){
  if(onboardShown||store.readOnly||firstName()) return;
  onboardShown=true;openWelcome();
}
function setSalary(v){
  const m=nowYM();
  let h=(state.settings.salaryHistory||[]).filter(e=>e.from!==m);
  if(v!==salaryFor(m)||!h.length) h.push({from:h.length?m:'2000-01',amount:v});
  else h=state.settings.salaryHistory;
  state.settings.salaryHistory=h;
}
function readAge(sel){const a=parseInt($(sel).value,10);return a>0&&a<120?a:null}
function openWelcome(){
  const cur=salaryFor(nowYM());
  openSheet(`<h3>Welcome to Cashflow Diaries</h3>
  <p style="color:var(--ink-2);margin:4px 0 0;font-size:.92rem">Let’s set up your profile so this feels like your own money diary.</p>
  <label class="field"><span>Your name</span><input id="wName" autocomplete="given-name" placeholder="What should we call you?"></label>
  <label class="field"><span>Age (optional)</span><input id="wAge" inputmode="numeric" maxlength="3"></label>
  <label class="field"><span>Monthly salary (optional)</span><input id="wSalary" inputmode="decimal" value="${cur||''}" placeholder="e.g. 12000"><small>You can change this anytime in settings.</small></label>
  <label class="field"><span>Currency</span><input id="wCur" value="${esc(state.settings.currency)}" maxlength="4" style="text-transform:uppercase"></label>
  <div class="actions"><button class="btn ghost" data-close>Skip for now</button><button class="btn" id="wSave">Let’s go</button></div>`);
  $('#wSave').onclick=()=>{
    const name=$('#wName').value.trim();
    if(!name){toast('Add your name to continue.');$('#wName').focus();return}
    state.settings.profile={name,age:readAge('#wAge')};
    const v=parseFloat(String($('#wSalary').value).replace(/,/g,''))||0;
    if(v) setSalary(v);
    state.settings.currency=($('#wCur').value.trim()||'AED').toUpperCase();
    persistSettings();closeSheet();renderAll();
    toast(`Welcome, ${firstName()}! Your diary is ready.`);
  };
}
function periodToggle(){
  return greetHTML()+`<div class="seg period"><button data-period="month" aria-pressed="${state.period==='month'}">Month</button><button data-period="year" aria-pressed="${state.period==='year'}">Whole year</button></div>`;
}
function yearSummary(y){
  const ymNow=nowYM();
  const txMonths=state.tx.map(t=>(t.date||'').slice(0,7)).filter(Boolean).sort();
  const first=txMonths[0]&&txMonths[0]<ymNow?txMonths[0]:ymNow;
  let salary=0,extra=0,spent=0;const byCat={};const perMonth=[];let from=null,to=null;
  for(let i=1;i<=12;i++){
    const m=`${y}-${pad(i)}`;const s=summary(m);
    const counted=m>=first&&m<=ymNow;
    if(counted&&s.salary){salary+=s.salary;from=from||m;to=m}
    extra+=s.extra;spent+=s.spent;
    for(const [c,v] of Object.entries(s.byCat)) byCat[c]=(byCat[c]||0)+v;
    perMonth.push({m,spent:s.spent,income:(counted?s.salary:0)+s.extra});
  }
  const byIn={};
  for(const t of state.tx) if(t.kind==='income'&&(t.date||'').slice(0,4)===String(y)){const c=ICAT[t.cat]?t.cat:'other_in';byIn[c]=(byIn[c]||0)+(+t.amount||0)}
  return {salary,extra,income:salary+extra,spent,left:salary+extra-spent,byCat,byIn,perMonth,from,to};
}
function renderYear(){
  const y=state.month.slice(0,4);
  const s=yearSummary(y);
  const el=$('#view-home');
  const cats=Object.entries(s.byCat).sort((a,b)=>b[1]-a[1]);
  const base=Math.max(s.income,s.spent,1);
  const pct=v=>s.spent?(v/s.spent<0.01?'<1%':Math.round(v/s.spent*100)+'%'):'';
  const salaryNote=s.from?` Salary is counted only for the months you’ve tracked (${s.from===s.to?ymLabel(s.from,true):ymLabel(s.from,true)+' to '+ymLabel(s.to,true)}).`:'';
  let html=periodToggle()+`<div class="hero">
    <div class="label">${s.left<0?'Over your income in '+y+' by':'Left over in '+y}</div>
    <div class="big num ${s.left<0?'neg':''}">${fmt(Math.abs(s.left))}</div>
    <div class="sub">Spent ${fmt(s.spent)}${s.income?' of '+fmt(s.income)+' coming in.':'.'}${salaryNote}</div>
    <div class="ribbon" role="img" aria-label="How your income was split this year">${cats.map(([c,v])=>`<span style="flex:0 0 ${(v/base*100).toFixed(2)}%;background:${CAT[c].color}" title="${esc(CAT[c].name)}"></span>`).join('')}</div>

let assets=null;
async function setupAssets(){

}
const blobUrl=id=>'/_blob/'+id;
function setReceipt(file){
  if(!assets||!file) return;
  if(state.receipt&&state.receipt.preview) URL.revokeObjectURL(state.receipt.preview);
  state.receipt={file,id:null,preview:URL.createObjectURL(file)};
  showReceipt();
}
function showReceipt(){
  const r=state.receipt,img=$('#rcThumb');
  if(r&&(r.preview||r.id)){img.src=r.preview||blobUrl(r.id);img.hidden=false;$('#rcRemove').hidden=false;$('#rcAdd').textContent='Change photo'}
  else{img.hidden=true;img.removeAttribute('src');$('#rcRemove').hidden=true;$('#rcAdd').textContent='Add photo'}
}

$('#rcThumb').onclick=()=>viewImage($('#rcThumb').src);
async function shrink(file){
  try{
    const bmp=await createImageBitmap(file);
    const k=Math.min(1,1600/Math.max(bmp.width,bmp.height));
    if(k===1&&file.size<1500000) return file;
    const c=document.createElement('canvas');c.width=Math.round(bmp.width*k);c.height=Math.round(bmp.height*k);
    c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
    const b=await new Promise(r=>c.toBlob(r,'image/jpeg',0.82));
    return b||file;
  }catch(e){return file}
}
function viewImage(src){
  openSheet(`<button class="icon-btn x" data-close aria-label="Close">✕</button><h3>Receipt</h3><img src="${esc(src)}" alt="Receipt photo" style="width:100%;border-radius:12px;margin-top:12px">`);
}

function editTx(id){
  const t=state.tx.find(x=>x.id===id);if(!t) return;
  state.editId=id;state.cat=t.cat||null;state.catTouched=true;
  state.receipt=t.receiptId?{file:null,id:t.receiptId}:null;showReceipt();

$('#fNote').oninput=()=>{
  if(state.catTouched) return;
  if(state.kind==='income'){const g=guessIncome($('#fNote').value);if(g!==state.cat){state.cat=g;renderCats()}return}
  const g=guessCat($('#fNote').value);
  if(g){state.cat=g;renderCats();$('#suggest').textContent='Sorted into '+CAT[g].name+'. Tap another category to change it.'}
  else if(state.cat){state.cat=null;renderCats();$('#suggest').textContent=''}

};
$('#saveTx').onclick=async()=>{
  const btn=$('#saveTx');if(btn.disabled) return;
  const amount=parseFloat(String($('#fAmount').value).replace(/,/g,''));
  if(!(amount>0)){toast('Type an amount first.');$('#fAmount').focus();return}
  const date=$('#fDate').value||todayISO();
  const note=$('#fNote').value.trim();
  let cat=state.kind==='income'?((state.cat&&ICAT[state.cat])?state.cat:(guessIncome(note)||'other_in')):(state.cat||guessCat(note)||'misc');
  const existing=state.editId?state.tx.find(x=>x.id===state.editId):null;
  let receiptId=state.receipt&&!state.receipt.file?state.receipt.id:null;
  if(state.receipt&&state.receipt.file&&assets){
    const label=btn.textContent;btn.disabled=true;btn.textContent='Saving photo…';
    try{const up=await assets.upload(await shrink(state.receipt.file));receiptId=up.id}
    catch(e){toast('Couldn’t save the photo. The entry was saved without it.')}
    btn.disabled=false;btn.textContent=label;
  }
  if(existing&&existing.receiptId&&existing.receiptId!==receiptId&&assets) assets.delete(existing.receiptId).catch(()=>{});
  const tx={id:state.editId||uid(),kind:state.kind,amount,date,note,cat:cat||null,receiptId:receiptId||null,created:existing?.created||Date.now()};
  if(existing?.loanId) tx.loanId=existing.loanId;
  if(existing) Object.assign(existing,tx); else state.tx.push(tx);
  persistTx(tx);
  const wasEdit=!!state.editId;
  state.month=date.slice(0,7);
  resetForm();
  const fn=firstName();
  toast(wasEdit?'Changes saved':(tx.kind==='income'?`${fn?'Nice, '+fn+'! ':''}Saved as ${ICAT[cat].name}`:`${fn?'Got it, '+fn+'. ':''}Saved to ${CAT[cat].name}`));
  renderAll();
  if(wasEdit) go('history');
};
$('#delTx').onclick=()=>twoTap($('#delTx'),'Tap again to delete',()=>{
  $('#delTx').dataset.armed='';$('#delTx').textContent='Delete this entry';
  const t=state.tx.find(x=>x.id===state.editId);if(!t) return;
  if(t.loanId){const l=state.settings.loans.find(x=>x.id===t.loanId);if(l){l.paidLog=(l.paidLog||[]).filter(m=>m!==t.date.slice(0,7));persistSettings()}}
  if(t.receiptId&&assets) assets.delete(t.receiptId).catch(()=>{});
  state.tx=state.tx.filter(x=>x.id!==t.id);removeTx(t.id);
  resetForm();toast('Entry deleted');renderAll();go('history');
});

const LOAN_TYPES={card:'Credit card installment',bank:'Bank loan',bnpl:'Tabby / Tamara / other'};
const loanTypeName=t=>LOAN_TYPES[t]||'Installment';
function renderLoans(){
  const loans=state.settings.loans;
  const el=$('#view-loans');
  const active=loans.filter(l=>!loanInfo(l).done);
  const monthlyTotal=active.reduce((s,l)=>s+(+l.monthly||0),0);
  const owed=active.reduce((s,l)=>s+loanInfo(l).remaining,0);
  const paidAll=loans.reduce((s,l)=>s+loanInfo(l).paid*(+l.monthly||0),0);
  let html=`<div class="hero"><div class="label">Still to pay on loans and installments</div><div class="big num">${fmt(owed)}</div><div class="sub">${active.length?`${fmt(monthlyTotal)} a month across ${active.length} ${active.length===1?'plan':'plans'}. `:'No active plans yet. '}${paidAll?`You’ve paid ${fmt(paidAll)} so far.`:''}</div></div>`;
  html+=`<div class="seg" style="margin:4px 0 0"><button data-loanview="plans" aria-pressed="${state.loanView!=='payments'}">Plans</button><button data-loanview="payments" aria-pressed="${state.loanView==='payments'}">Payments made</button></div>`;

  html+=`<section class="block">`;

  for(const l of loans){
    const i=loanInfo(l);
    const dense=i.total>60?' dense':'';
    html+=`<div class="loan" style="--loan-c:${CAT.loans.color}">
      <div class="loan-head"><div><b>${esc(l.name)}</b><br><span class="tag ${i.done?'done':''}">${i.done?'Fully paid':esc(loanTypeName(l.type))}</span></div>
      <div style="text-align:right"><b class="num">${fmt(l.monthly)}</b><div style="font-size:.8rem;color:var(--ink-3)">per month${l.dueDay?', due '+ordinal(+l.dueDay):''}</div></div></div>
      <div class="ticks${dense}" aria-label="${i.paid} of ${i.total} payments made">${Array.from({length:i.total},(_,k)=>`<i class="${k<i.paid?'on':''}"></i>`).join('')}</div>
      <div class="loan-stats">
        <div><b class="num">${i.paid}/${i.total}</b><span>payments made</span></div>
        <div><b class="num">${i.left}</b><span>${i.left===1?'month':'months'} to go</span></div>
        <div><b class="num">${fmt(i.paid*(+l.monthly||0),1)}</b><span>paid so far</span></div>
        <div><b class="num">${fmt(i.remaining,1)}</b><span>still to pay</span></div>
      </div>
      <div class="loan-actions">
        ${i.done?'':(i.paidThisMonth?`<button class="btn small ghost" data-unpay="${l.id}">Paid for ${MONTHS[+nowYM().slice(5)-1]}. Undo</button>`:`<button class="btn small" data-pay="${l.id}">Mark ${MONTHS[+nowYM().slice(5)-1]} paid</button>`)}
        <button class="btn small ghost" data-editloan="${l.id}">Edit</button>
        ${i.done?'':`<span style="align-self:center;font-size:.85rem;color:var(--ink-3)">Last payment ${ymLabel(i.lastMonth,true)}</span>`}
      </div>
    </div>`;
  }
  html+=`</section><button class="btn full" data-act="newloan">Add a loan or installment</button>`;

function loanPaymentsHTML(){
  const loans=state.settings.loans;
  let h=`<section class="block"><h2>Paid per plan</h2>`;
  if(!loans.length) h+=`<div class="empty"><p>No plans yet. Add one under Plans.</p></div>`;
  for(const l of loans){const i=loanInfo(l);
    h+=`<div class="row"><span class="dot" style="background:${CAT.loans.color}"></span><div class="name">${esc(l.name)}<small>${i.paid} of ${i.total} months paid${i.done?', fully paid':`, ${i.left} to go`}</small></div><div class="amt">${fmt(i.paid*(+l.monthly||0),1)}<small>paid so far</small></div></div>`}
  if(loans.some(l=>+l.paidBefore>0)) h+=`<p style="font-size:.82rem;color:var(--ink-3);margin:10px 0 0">Includes payments you made before you started tracking.</p>`;
  h+=`</section>`;
  const pays=state.tx.filter(t=>t.kind!=='income'&&(t.loanId||t.cat==='loans')).sort((a,b)=>a.date<b.date?1:-1);
  h+=`<section class="block"><h2>Payment history</h2>`;
  if(!pays.length) h+=`<div class="empty"><p>Payments show up here when you tap Mark paid, or log an expense under Loans & installments.</p></div>`;
  const byM={};for(const t of pays){const m=t.date.slice(0,7);(byM[m]=byM[m]||[]).push(t)}
  for(const m of Object.keys(byM)){const tot=byM[m].reduce((a,t)=>a+(+t.amount||0),0);

  return h+`</section>`;
}
function payLoan(id){
  const l=state.settings.loans.find(x=>x.id===id);if(!l) return;
  const m=nowYM();l.paidLog=l.paidLog||[];
  if(l.paidLog.includes(m)) return;
  l.paidLog.push(m);persistSettings();
  const tx={id:uid(),kind:'expense',amount:+l.monthly,date:todayISO(),note:l.name,cat:'loans',loanId:l.id,created:Date.now()};
  state.tx.push(tx);persistTx(tx);
  const i=loanInfo(l);
  const fn=firstName();
  toast(i.done?`${fn?'Congrats, '+fn+'! ':''}${l.name} is fully paid.`:`${fn?'Nice one, '+fn+'. ':'Paid. '}${i.left} ${i.left===1?'month':'months'} to go.`);
  renderAll();
}
function unpayLoan(id){
  const l=state.settings.loans.find(x=>x.id===id);if(!l) return;
  const m=nowYM();l.paidLog=(l.paidLog||[]).filter(x=>x!==m);persistSettings();
  const t=state.tx.find(x=>x.loanId===id&&x.date.slice(0,7)===m);
  if(t){state.tx=state.tx.filter(x=>x!==t);removeTx(t.id)}
  toast('Payment undone');renderAll();
}

  }
  el.innerHTML=html;
  const sel=$('#filterSel');sel.value=state.filter;sel.onchange=()=>{state.filter=sel.value;renderHistory()};

  openSheet(`<button class="icon-btn x" data-close aria-label="Close">✕</button><h3>Profile and settings</h3>
  <div class="two"><label class="field"><span>Name</span><input id="sName" value="${esc(pr.name||'')}" autocomplete="given-name"></label><label class="field"><span>Age (optional)</span><input id="sAge" inputmode="numeric" maxlength="3" value="${pr.age||''}"></label></div>
  <p style="color:var(--ink-2);margin:4px 0 0;font-size:.92rem">Your salary shows up as money in every month. If it changes, update it here and earlier months stay as they were.</p>
  <div class="privacy"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 018 0v4"/></svg><span>${store.mode==='db'?'Your entries, loans and salary are stored in a private space tied to your Claude account. Anyone else who opens this link gets their own empty tracker and can’t see your numbers, and neither can the person who shared it.':'Your entries are saved only in this browser on this device and aren’t sent anywhere.'}</span></div>
  <label class="field"><span>Monthly salary</span><input id="sSalary" inputmode="decimal" value="${cur||''}" placeholder="e.g. 12000"></label>
  <label class="field"><span>Currency</span><input id="sCur" value="${esc(state.settings.currency)}" maxlength="4" style="text-transform:uppercase"><small>AED, PHP, USD… shown next to every amount.</small></label>
  <div class="field"><span>Appearance</span><div class="seg three" id="sTheme">${['auto','light','dark'].map(t=>`<button type="button" data-theme-opt="${t}" aria-pressed="${(savedTheme||'auto')===t}">${t==='auto'?'Auto':t==='light'?'Off-white':'Matte black'}</button>`).join('')}</div><small>Auto follows your phone’s light or dark setting.</small></div>
  ${store.mode==='local'?`<div class="field"><span>Backup</span><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="btn small ghost" id="bkDown">Download backup</button><button type="button" class="btn small ghost" id="bkUp">Restore from backup</button></div><small>Your data lives only in this browser. Download a backup now and then, and restore it on a new phone or browser.</small><input type="file" id="bkFile" accept="application/json,.json" hidden></div>`:''}
  <div class="actions"><button class="btn ghost" data-close>Cancel</button><button class="btn" id="sSave">Save</button></div>`);
  if(store.mode==='local'){
    $('#bkDown').onclick=()=>saveFile(`cashflow-diaries-backup-${todayISO()}.json`,JSON.stringify({app:'cashflow-diaries',version:1,settings:state.settings,tx:state.tx},null,1),'application/json');
    $('#bkUp').onclick=()=>$('#bkFile').click();
    $('#bkFile').onchange=async e=>{
      const f=e.target.files[0];e.target.value='';if(!f) return;
      try{
        const d=JSON.parse(await f.text());
        if(!d||d.app!=='cashflow-diaries'||!Array.isArray(d.tx)) throw 0;
        const b=$('#bkUp');
        twoTap(b,'Tap again to replace everything',()=>{state.settings=normSettings(d.settings);state.tx=d.tx;saveLocal();closeSheet();renderAll();toast(addr('your backup is restored.'))});
        if(b.dataset.armed!=='1') return;
        toast('Tap again to replace what’s in the app now.');
      }catch(err){toast('That file isn’t a Cashflow Diaries backup.')}
    };
  }
  $('#sTheme').onclick=e=>{const b=e.target.closest('button');if(!b) return;setTheme(b.dataset.themeOpt);$('#sTheme').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))};
  $('#sSave').onclick=()=>{
    const nm=$('#sName').value.trim();
    state.settings.profile=nm?{name:nm,age:readAge('#sAge')}:null;
    setSalary(parseFloat(String($('#sSalary').value).replace(/,/g,''))||0);
    state.settings.currency=($('#sCur').value.trim()||'AED').toUpperCase();
    persistSettings();closeSheet();renderAll();toast('Settings saved');
  };
}

function openLoanForm(id){
  const l=id?state.settings.loans.find(x=>x.id===id):null;
  const start=l?.start||nowYM();
  const total=l?.totalMonths||48;
  const years=total%12===0;
  openSheet(`<button class="icon-btn x" data-close aria-label="Close">✕</button><h3>${l?'Edit plan':'Add a loan or installment'}</h3>
  <label class="field"><span>Name</span><input id="lName" value="${esc(l?.name||'')}" placeholder="e.g. Car loan, iPhone on my credit card"></label>
  <div class="field"><span>Type</span><div class="seg three" id="lType">${Object.entries(LOAN_TYPES).map(([k,v])=>`<button type="button" data-t="${k}" aria-pressed="${(l?.type||'card')===k}">${k==='bnpl'?'Tabby / other':v.replace(' installment','')}</button>`).join('')}</div></div>
  <label class="field"><span>Monthly payment (${esc(state.settings.currency)})</span><input id="lMonthly" inputmode="decimal" value="${l?.monthly||''}" placeholder="e.g. 1250"></label>
  <div class="two">
    <label class="field"><span>How long</span><input id="lLen" inputmode="numeric" value="${years?total/12:total}"></label>
    <label class="field"><span>&nbsp;</span><select id="lUnit"><option value="y" ${years?'selected':''}>years</option><option value="m" ${years?'':'selected'}>months</option></select></label>
  </div>
  <div class="two">
    <label class="field"><span>First payment month</span><input type="month" id="lStart" value="${start}"></label>
    <label class="field"><span>Due day (optional)</span><input id="lDue" inputmode="numeric" value="${l?.dueDay||''}" placeholder="e.g. 15"></label>
  </div>
  <label class="field"><span>Payments already made before this month</span><input id="lPaid" inputmode="numeric" value="${l?(+l.paidBefore||0):''}"><small id="lPaidHint"></small></label>
  <div class="actions">${l?`<button class="btn danger" id="lDel">Delete</button>`:`<button class="btn ghost" data-close>Cancel</button>`}<button class="btn" id="lSave">${l?'Save changes':'Add plan'}</button></div>`);
  let type=l?.type||'card';
  $('#lType').onclick=e=>{const b=e.target.closest('button');if(!b) return;type=b.dataset.t;$('#lType').querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b))};
  const hint=()=>{const st=$('#lStart').value||nowYM();const n=Math.max(0,monthsBetween(st,nowYM()));$('#lPaidHint').textContent=`Starting ${ymLabel(st)} means about ${n} ${n===1?'payment':'payments'} so far.`;if(!l&&$('#lPaid').dataset.touched!=='1') $('#lPaid').value=n};
  $('#lPaid').oninput=()=>{$('#lPaid').dataset.touched='1'};
  $('#lStart').onchange=hint;hint();
  $('#lSave').onclick=()=>{
    const name=$('#lName').value.trim();const monthly=parseFloat(String($('#lMonthly').value).replace(/,/g,''));
    const len=parseInt($('#lLen').value,10);const totalMonths=$('#lUnit').value==='y'?len*12:len;
    if(!name){toast('Give the plan a name.');return}
    if(!(monthly>0)){toast('Add the monthly payment.');return}
    if(!(totalMonths>0)){toast('Add how long the plan runs.');return}
    const data={name,type,monthly,totalMonths,start:$('#lStart').value||nowYM(),dueDay:parseInt($('#lDue').value,10)||null,paidBefore:Math.max(0,parseInt($('#lPaid').value,10)||0)};
    if(l) Object.assign(l,data); else state.settings.loans.push(Object.assign({id:uid(),paidLog:[]},data));
    persistSettings();closeSheet();renderAll();toast(l?'Plan updated':'Plan added');
  };
  if(l) $('#lDel').onclick=()=>twoTap($('#lDel'),'Tap again',()=>{state.settings.loans=state.settings.loans.filter(x=>x.id!==l.id);persistSettings();closeSheet();renderAll();toast('Plan deleted. Logged payments stay in History.')});
}

/* ---------- render: monthly expenses ---------- */
function renderExpenses(){
  const el=$('#view-expenses');
  const s=summary(state.month);
  const list=monthTx(state.month).filter(t=>t.kind!=='income').sort((a,b)=>a.date===b.date?(a.created||0)-(b.created||0):(a.date<b.date?-1:1));
  const item=t=>{const c=CAT[t.cat]||CAT.misc;const d=new Date(t.date+'T00:00:00');
    return `<button class="srow" data-tx="${t.id}"><span class="sdate">${d.getDate()} ${MONTHS[d.getMonth()].slice(0,3)}</span><span class="sname"><b>${esc(t.note||c.name)}</b>${state.group==='cat'?'':`<small>${esc(c.name)}</small>`}</span>${t.receiptId?`<img class="thumb" src="${blobUrl(t.receiptId)}" alt="Receipt" data-img="${t.receiptId}">`:''}<span class="samt">${fmt(t.amount,1)}</span></button>`};
  let html=`<div class="seg period"><button data-group="date" aria-pressed="${state.group!=='cat'}">By date</button><button data-group="cat" aria-pressed="${state.group==='cat'}">By category</button></div>`;
  html+=`<section class="block stmt"><h2>Expenses for ${ymLabel(state.month)}</h2><div class="count">${list.length} ${list.length===1?'item':'items'}</div>`;
  if(!list.length){
    html+=`<div class="empty"><p>No expenses logged for ${ymLabel(state.month)} yet.</p><button class="btn" data-act="add">Add an expense</button></div>`;
  } else if(state.group==='cat'){
    const groups={};for(const t of list){const c=CAT[t.cat]?t.cat:'misc';(groups[c]=groups[c]||[]).push(t)}
    const order=Object.keys(groups).sort((a,b)=>s.byCat[b]-s.byCat[a]);
    html+=order.map(c=>`<div class="sgroup"><span><i class="dot" style="background:${CAT[c].color}"></i>${esc(CAT[c].name)}</span><span>${fmt(s.byCat[c],1)}</span></div><div class="slist">${groups[c].map(item).join('')}</div>`).join('');
  } else {
    html+=`<div class="slist">${list.map(item).join('')}</div>`;
  }
  const due=state.month===nowYM()?state.settings.loans.filter(l=>{const i=loanInfo(l);return !i.done&&!i.paidThisMonth&&l.start<=nowYM()}):[];
  const dueTotal=due.reduce((a,l)=>a+(+l.monthly||0),0);
  if(due.length) html+=`<div class="sgroup"><span><i class="dot" style="background:${CAT.loans.color}"></i>Loan payments still due</span><span>${fmt(dueTotal,1)}</span></div><div class="slist">${due.map(l=>`<div class="srow"><span class="sdate">${l.dueDay?l.dueDay+' '+MONTHS[+nowYM().slice(5)-1].slice(0,3):'Due'}</span><span class="sname"><b>${esc(l.name)}</b><small>Not paid yet</small></span><button class="btn small" data-pay="${l.id}">Paid</button><span class="samt">${fmt(l.monthly,1)}</span></div>`).join('')}</div>`;
  html+=`<div class="stmt-foot">
    <div class="line"><span>Total spent</span><b>${fmt(s.spent)}</b></div>
    <div class="line"><span>Money in${s.extra?' (salary + extra)':''}</span><b>${fmt(s.income)}</b></div>
    <div class="line left"><span>${s.left<0?'Over by':'What’s left'}</span><b class="${s.left<0?'neg':''}">${fmt(Math.abs(s.left))}</b></div>
    ${dueTotal?`<div class="line"><span>Left after loans still due</span><b style="${s.left-dueTotal<0?'color:var(--danger)':''}">${fmt(s.left-dueTotal)}</b></div>`:''}
  </div></section>`;
  el.innerHTML=html;
}

/* ---------- navigation ---------- */
function go(tab,keep){
  state.tab=tab;
  document.querySelectorAll('.view').forEach(v=>v.hidden=v.id!=='view-'+tab);
  document.querySelectorAll('nav.tabs button').forEach(b=>{if(b.dataset.tab===tab) b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  if(tab==='add'&&!keep&&!state.editId) resetForm();
  const plain=tab==='add'||tab==='loans';
  $('#prevM').style.visibility=$('#nextM').style.visibility=plain?'hidden':'visible';
  renderTitle();
  window.scrollTo(0,0);
}
document.querySelector('nav.tabs').onclick=e=>{const b=e.target.closest('button');if(b){if(b.dataset.tab!=='add'&&state.editId) resetForm();go(b.dataset.tab)}};
const step=()=>state.tab==='home'&&state.period==='year'?12:1;
$('#prevM').onclick=()=>{state.month=addMonths(state.month,-step());renderAll()};
$('#nextM').onclick=()=>{state.month=addMonths(state.month,step());renderAll()};
$('#openSettings').onclick=openSettings;
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-img],[data-pay],[data-unpay],[data-editloan],[data-act],[data-tx],[data-close],[data-period],[data-group],[data-loanview]');if(!t) return;
  if(t.dataset.img){viewImage(blobUrl(t.dataset.img));return}
  if(t.dataset.group){state.group=t.dataset.group;renderExpenses();return}
  if(t.dataset.loanview){state.loanView=t.dataset.loanview;renderLoans();return}
  if(t.dataset.period){state.period=t.dataset.period;renderAll();return}
  if(t.dataset.pay) payLoan(t.dataset.pay);
  else if(t.dataset.unpay) unpayLoan(t.dataset.unpay);
  else if(t.dataset.editloan) openLoanForm(t.dataset.editloan);
  else if(t.dataset.tx) editTx(t.dataset.tx);
  else if(t.hasAttribute('data-close')) closeSheet();
  else if(t.dataset.act==='add') go('add');
  else if(t.dataset.act==='settings') openSettings();
  else if(t.dataset.act==='newloan') openLoanForm();
  else if(t.dataset.act==='csv') exportCSV();
});

function renderTitle(){
  $('#monthTitle').textContent=state.tab==='loans'?'Loans':state.tab==='add'?(state.editId?'Edit entry':'New entry'):(state.tab==='home'&&state.period==='year'?state.month.slice(0,4):ymLabel(state.month));
}
function renderAll(){
  renderTitle();
  $('#curLabel').textContent=state.settings.currency;
  renderHome();renderLoans();renderHistory();renderExpenses();
}

/* ---------- light / dark ---------- */
const THEME_KEY='salary-map-theme';
let savedTheme=null;try{savedTheme=localStorage.getItem(THEME_KEY)}catch(e){}
const darkMQ=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
const currentTheme=()=>document.documentElement.getAttribute('data-theme')||(darkMQ&&darkMQ.matches?'dark':'light');
const SUN='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>';
const MOON='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z"/></svg>';
function updateThemeBtn(){const dark=currentTheme()==='dark';const b=$('#themeBtn');b.innerHTML=dark?SUN:MOON;b.setAttribute('aria-label',dark?'Switch to off-white mode':'Switch to matte black mode')}
function setTheme(t){
  savedTheme=(t==='light'||t==='dark')?t:null;
  try{savedTheme?localStorage.setItem(THEME_KEY,savedTheme):localStorage.removeItem(THEME_KEY)}catch(e){}
  if(savedTheme) document.documentElement.setAttribute('data-theme',savedTheme); else document.documentElement.removeAttribute('data-theme');
  updateThemeBtn();
}
setTheme(savedTheme);
if(darkMQ&&darkMQ.addEventListener) darkMQ.addEventListener('change',updateThemeBtn);
$('#themeBtn').onclick=()=>{const next=currentTheme()==='dark'?'light':'dark';setTheme(next);toast(next==='dark'?'Matte black mode':'Off-white mode')};

/* ---------- start ---------- */
loadLocal();
resetForm();
renderAll();
connect();
</script>
</body>
</html>
